# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@solsticeai/equinox-system-prompt'

- id: tools
  name: '@solsticeai/equinox-tools'

- id: subprocess
  name: '@solsticeai/equinox-subprocess-local'

- id: bash
  name: '@solsticeai/equinox-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@solsticeai/equinox-shell-env'

- id: tasks
  name: '@solsticeai/equinox-jobs-local'

- id: tool-jobs
  name: '@solsticeai/equinox-tool-jobs'

- id: tool-pwsh
  name: '@solsticeai/equinox-tool-pwsh'
