[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "equinox-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled equinox CLI runtime for the Equinox Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Solstice AI" }]

[project.urls]
Homepage = "https://github.com/Solstice-Labs/Equinox"
Documentation = "https://github.com/Solstice-Labs/Equinox/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/Solstice-Labs/Equinox/issues"
Source = "https://github.com/Solstice-Labs/Equinox"

[project.scripts]
equinox = "equinox_harness_runtime:main"
dsh = "equinox_harness_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = ["src/equinox_harness_runtime/runtime/equinox-harness-sdk-runtime-*"]
exclude = ["src/equinox_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/equinox_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
