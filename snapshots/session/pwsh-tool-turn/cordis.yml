# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@solsticeai/equinox-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@solsticeai/equinox-subprocess-local'

- id: bash-sandbox
  name: '@solsticeai/equinox-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@solsticeai/equinox-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@solsticeai/equinox-shell-env'

- id: agent-default-model
  name: '@solsticeai/equinox-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@solsticeai/equinox-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@solsticeai/equinox-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@solsticeai/equinox-system-prompt'
  config:
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: goal
  name: '@solsticeai/equinox-goal'
  disabled: true

- id: goal-round-driver
  name: '@solsticeai/equinox-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@solsticeai/equinox-command-goal'
  disabled: true

- id: tool-goal
  name: '@solsticeai/equinox-tool-goal'
  disabled: true

- id: skill
  name: '@solsticeai/equinox-skill'
  disabled: true

- id: skill-filesystem
  name: '@solsticeai/equinox-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@solsticeai/equinox-tool-skill'
  disabled: true

- id: tool-bash
  name: '@solsticeai/equinox-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@solsticeai/equinox-tool-pwsh'
  disabled: false
